name: Reprocheck pipeline
run-name: reprocheck ${{ inputs.app_id }}

concurrency:
  group: reprocheck-${{ inputs.app_id }}-${{ inputs.build_pipeline_id }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: 'Application ID'
        required: true
      git_ref:
        description: 'Git reference (unused, for backwards compatibility)'
        required: true
      build_pipeline_id:
        description: 'Build pipeline ID'
        required: true
      callback_url:
        description: 'Callback URL'
        required: true
      callback_token:
        description: 'Callback token'
        required: true
      build_type:
        description: 'Build type'
        required: true
        default: 'default'
      spot:
        description: 'Use spot instances'
        required: false
        default: 'true'
      pr_target_branch:
        description: 'Target branch for PR builds (unused)'
        required: false
        default: 'master'

env:
  CALLBACK_URL: ${{ inputs.callback_url }}
  APP_ID: ${{ inputs.app_id }}
  BUILD_PIPELINE_ID: ${{ inputs.build_pipeline_id }}

jobs:
  update-log-url:
    runs-on: ubuntu-latest
    steps:
      - name: Report log URL to the backend
        run: |
          CALLBACK_TOKEN="$(jq -er '.inputs.callback_token | strings | select(test("[\r\n]") | not)' "$GITHUB_EVENT_PATH")"
          echo "::add-mask::$CALLBACK_TOKEN"

          curl -fsS --retry-all-errors --retry 5 --retry-delay 10 \
            --retry-max-time 150 --connect-timeout 60 -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $CALLBACK_TOKEN" \
            -d "$(jq -n --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{log_url: $url}')" \
            -- "$CALLBACK_URL/log_url"

  setup-runner:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.set-runner.outputs.runner }}
      timeout: ${{ steps.set-runner.outputs.timeout }}
    steps:
      - id: set-runner
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
          SPOT: ${{ inputs.spot }}
        run: |
          if [[ "$BUILD_TYPE" == "default" ]]; then
            echo "runner=ubuntu-24.04" >> "$GITHUB_OUTPUT"
            echo "timeout=360" >> "$GITHUB_OUTPUT"
          else
            [[ "$SPOT" == true || "$SPOT" == false ]] || exit 1
            echo "runner=runs-on=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/runner=medium-amd64/tag=arch-amd64/retry=false/spot=$SPOT" >> "$GITHUB_OUTPUT"
            echo "timeout=240" >> "$GITHUB_OUTPUT"
          fi

  reprocheck:
    needs: [update-log-url, setup-runner]
    runs-on: ${{ needs.setup-runner.outputs.runner }}
    timeout-minutes: ${{ fromJSON(needs.setup-runner.outputs.timeout) }}
    steps:
      - name: Disable AppArmor
        run: |
          sudo aa-teardown >/dev/null 2>&1 || true
          sudo systemctl disable --now apparmor.service >/dev/null 2>&1 || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Setup work directory
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/reproworkdir
          mkdir -p ${GITHUB_WORKSPACE}/reproworkdir/tmp
          mkdir -p ${GITHUB_WORKSPACE}/reproworkdir/.local/share
          chmod -R 777 ${GITHUB_WORKSPACE}/reproworkdir

      - name: Download seccomp profile
        run: |
          curl -s https://raw.githubusercontent.com/flathub-infra/vorarbeiter/refs/heads/main/flatpak.seccomp.json -o flatpak.seccomp.json

      - name: Pull linter image
        run: |
          for delay in 0 15 30 60 120; do
            sleep "$delay"
            docker pull ghcr.io/flathub-infra/flatpak-builder-lint:unprivileged && exit 0
          done
          exit 1

      - name: Run reprocheck
        continue-on-error: true
        id: reprocheck
        env:
          AWS_DEFAULT_REGION: ${{ secrets.REPRO_AWS_DEFAULT_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.REPRO_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.REPRO_AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET_NAME: ${{ secrets.REPRO_AWS_S3_BUCKET_NAME }}
        run: |
          docker run --rm \
            --entrypoint="" \
            --security-opt seccomp=./flatpak.seccomp.json \
            --security-opt apparmor=unconfined \
            --cap-drop all \
            -v /proc:/host/proc \
            -v "${GITHUB_WORKSPACE}/reproworkdir:/reproworkdir" \
            -e TMPDIR=/reproworkdir/tmp \
            -e XDG_DATA_HOME=/reproworkdir/.local/share \
            -e GITHUB_SERVER_URL \
            -e GITHUB_REPOSITORY \
            -e GITHUB_RUN_ID \
            -e AWS_DEFAULT_REGION \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_S3_BUCKET_NAME \
            -w /reproworkdir \
            ghcr.io/flathub-infra/flatpak-builder-lint:unprivileged \
            flathub-repro-checker --json --upload-result --appid "$APP_ID" | tee reprocheck-output.json

      - name: Save reprocheck output
        if: always()
        run: |
          if [ -f reprocheck-output.json ]; then
            cp reprocheck-output.json /tmp/reprocheck-result.json
          else
            jq -n --arg appid "$APP_ID" --arg timestamp "$(date -u +"%Y-%m-%dT%H:%M:%S.%6N%:z")" \
              '{status_code: "1", message: "Reprocheck failed to run", $appid, $timestamp}' > /tmp/reprocheck-result.json
          fi

      - name: Report job status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          CALLBACK_TOKEN="$(jq -er '.inputs.callback_token | strings | select(test("[\r\n]") | not)' "$GITHUB_EVENT_PATH")"
          echo "::add-mask::$CALLBACK_TOKEN"

          if [[ "$JOB_STATUS" == "cancelled" ]]; then
            status="cancelled"
            status_code="1"
            timestamp="$(date -u +\"%Y-%m-%dT%H:%M:%S.%6N%:z\")"
            message="Job cancelled"
            result_url=""
          elif [ -f /tmp/reprocheck-result.json ]; then
            reprocheck_data=$(cat /tmp/reprocheck-result.json)
            status_code=$(echo "$reprocheck_data" | jq -r '.status_code // "1"')
            timestamp=$(echo "$reprocheck_data" | jq -r '.timestamp // ""')
            message=$(echo "$reprocheck_data" | jq -r '.message // ""')
            result_url=$(echo "$reprocheck_data" | jq -r '.result_url // ""')

            if [[ "$status_code" == "0" ]]; then
              status="success"
            else
              status="failure"
            fi
          else
            status="failure"
            status_code="1"
            timestamp="$(date -u +\"%Y-%m-%dT%H:%M:%S.%6N%:z\")"
            message="Reprocheck output not available"
            result_url=""
          fi

          payload=$(jq -n \
            --arg status "$status" \
            --arg build_pipeline_id "$BUILD_PIPELINE_ID" \
            --arg status_code "$status_code" \
            --arg timestamp "$timestamp" \
            --arg appid "$APP_ID" \
            --arg result_url "$result_url" \
            --arg message "$message" \
            '{
              status: $status,
              build_pipeline_id: $build_pipeline_id,
              status_code: $status_code,
              timestamp: $timestamp,
              appid: $appid,
              result_url: $result_url,
              message: $message
            }')

          curl -fsS --retry-all-errors --retry 5 --retry-delay 10 \
            --retry-max-time 150 --connect-timeout 60 -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $CALLBACK_TOKEN" \
            -d "$payload" \
            -- "$CALLBACK_URL/reprocheck"

      - name: Dump reprocheck log
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          LOG_FILE="${GITHUB_WORKSPACE}/reproworkdir/.local/share/flathub_repro_checker/reprocheck.log"
          cat "$LOG_FILE" || true

  callback:
    runs-on: ubuntu-latest
    needs: [reprocheck]
    if: ${{ always() && needs.reprocheck.result == 'failure' }}
    steps:
      - name: Report job status
        run: |
          CALLBACK_TOKEN="$(jq -er '.inputs.callback_token | strings | select(test("[\r\n]") | not)' "$GITHUB_EVENT_PATH")"
          echo "::add-mask::$CALLBACK_TOKEN"

          curl -sS --retry-all-errors --retry 5 --retry-delay 10 \
            --retry-max-time 150 --connect-timeout 60 -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $CALLBACK_TOKEN" \
            -d "$(jq -n --arg build_pipeline_id "$BUILD_PIPELINE_ID" '{status: "failure", $build_pipeline_id}')" \
            -- "$CALLBACK_URL/reprocheck"
